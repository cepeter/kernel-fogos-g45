name: Build Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Kernel tag/branch to build
        default: MMI-V1UGS35H.75-14-9-3-1-2
        required: true
        type: string
      variant:
        description: Build variant
        default: qgki-consolidate
        required: true
        type: choice
        options:
          - qgki
          - qgki-consolidate
          - qgki-debug
          - gki
          - gki-only
      product:
        description: TARGET_PRODUCT (device, e.g. fogos_g)
        default: fogos_g
        required: true
        type: string
      build_variant:
        description: TARGET_BUILD_VARIANT (user / userdebug)
        default: userdebug
        required: true
        type: choice
        options:
          - user
          - userdebug
      ksu:
        description: KernelSU integration
        default: v1.0.2
        required: true
        type: choice
        options:
          - none
          - v1.0.2
      susfs:
        description: SUSFS integration
        default: "5.4"
        required: true
        type: choice
        options:
          - none
          - "5.4"
      toolchain:
        description: Compiler (16 = ZyCromerZ clang16, 11 = AOSP clang 11.0.2 stock)
        default: "16"
        required: true
        type: choice
        options:
          - "16"
          - "11"
      config_source:
        description: Defconfig source (generate = tree machinery, stock = exact stock -1-3 config)
        default: generate
        required: true
        type: choice
        options:
          - generate
          - stock

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout kernel source
        run: |
          git init
          git remote add origin https://github.com/cepeter/kernel-fogos-g45.git
          git remote add upstream https://github.com/MotorolaMobilityLLC/kernel-msm.git
          # Try fork first, fallback to upstream
          git fetch --depth=1 origin ${{ inputs.tag }} 2>/dev/null && git checkout ${{ inputs.tag }} || \
          (git fetch --depth=1 upstream ${{ inputs.tag }} && git checkout ${{ inputs.tag }})
          echo "Checked out: $(git log --oneline -1)"

      - name: Prepare toolchain dirs
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          mkdir -p prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          mkdir -p prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9

      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: prebuilts
          key: tc-v4-${{ runner.arch }}-clang${{ inputs.toolchain }}

      - name: Cache ccache
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ inputs.tag }}-${{ inputs.variant }}-${{ inputs.ksu }}-${{ inputs.susfs }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.tag }}-${{ inputs.variant }}-${{ inputs.ksu }}-${{ inputs.susfs }}-

      - name: Download Clang (${{ inputs.toolchain }})
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          set -e
          if [ "${{ inputs.toolchain }}" = "11" ]; then
            mkdir -p prebuilts/clang/host/linux-x86/clang11
            curl -L --fail --silent --show-error \
              "https://github.com/cepeter/kernel-fogos-g45/releases/download/toolchain-clang11/clang11.tar.gz" \
              | tar -xz -C prebuilts/clang/host/linux-x86/clang11/
            ls -d prebuilts/clang/host/linux-x86/clang11/bin >/dev/null && echo "CLANG11_OK"
          else
            mkdir -p prebuilts/clang/host/linux-x86/clang16
            curl -L --fail --silent --show-error \
              "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" \
              | tar -xz -C prebuilts/clang/host/linux-x86/clang16/
            ls -d prebuilts/clang/host/linux-x86/clang16/bin >/dev/null && echo "CLANG_OK"
          fi

      - name: Install ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache zip
          ccache --version | head -1

      - name: Resolve toolchain paths
        run: |
          if [ "${{ inputs.toolchain }}" = "11" ]; then
            CLANG_BIN="${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86/clang11/bin"
          else
            CLANG_BIN="$(echo ${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86/clang*/bin | awk '{print $1}')"
          fi
          echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"
          echo "Resolved: CLANG_BIN=${CLANG_BIN}"

      - name: Verify toolchain (pure LLVM)
        run: |
          ls "${CLANG_BIN}" | grep -E "^(clang|ld.lld|llvm-ar|llvm-nm|llvm-objcopy)$" || true
          "${CLANG_BIN}/clang" --version | head -1
          echo "LLVM_TOOLCHAIN_READY"

      - name: Apply toolchain fixes (WALT -I for clang)
        if: inputs.susfs == 'none'
        run: |
          curl -sL "https://raw.githubusercontent.com/cepeter/kernel-fogos-g45/android-13-release-ttz/toolchain-walt-fix.patch" -o toolchain-walt-fix.patch
          git apply toolchain-walt-fix.patch
          echo "TOOLCHAIN_FIX_OK"

      - name: Integrate KernelSU v1.0.2 (classic layout)
        if: inputs.ksu != 'none'
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v1.0.2/kernel/setup.sh" | bash -s v1.0.2
          ls -la KernelSU | head
          ls -la drivers/kernelsu 2>/dev/null || echo "WARN: no drivers/kernelsu symlink"
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig

      - name: Integrate SUSFS v1.5.5 (kernel-5.4 branch)
        if: inputs.ksu != 'none' && inputs.susfs != 'none'
        run: |
          git clone --depth 1 -b kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu susfs4ksu
          # --- main kernel side ---
          cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch .
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          echo "--- applying 50_add_susfs_in_kernel-5.4.patch (4 known rejects, fixed next) ---"
          patch -p1 --forward < 50_add_susfs_in_kernel-5.4.patch || true
          echo "--- applying Motorola-specific fix ---"
          curl -sL "https://raw.githubusercontent.com/cepeter/kernel-fogos-g45/android-13-release-ttz/susfs-5.4-moto-fix.patch" -o susfs-5.4-moto-fix.patch
          git apply susfs-5.4-moto-fix.patch
          # --- KSU driver side (classic KernelSU dir at kernel root) ---
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          echo "--- applying 10_enable_susfs_for_ksu.patch (in KernelSU/, 1 known reject fixed next) ---"
          cd KernelSU && patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
          cd ..
          echo "--- applying KernelSU v1.0.2 core_hook fix ---"
          curl -sL "https://raw.githubusercontent.com/cepeter/kernel-fogos-g45/android-13-release-ttz/susfs-ksu10-moto-fix.patch" -o susfs-ksu10-moto-fix.patch
          git apply susfs-ksu10-moto-fix.patch
          echo "--- applying KernelSU v1.0.2 sepolicy fix (<5.9 guard) ---"
          curl -sL "https://raw.githubusercontent.com/cepeter/kernel-fogos-g45/android-13-release-ttz/susfs-ksu10-sepolicy-fix.patch" -o susfs-ksu10-sepolicy-fix.patch
          git apply susfs-ksu10-sepolicy-fix.patch
          echo "--- applying KernelSU v1.0.2 rules fix (5.4 ss->policydb) ---"
          curl -sL "https://raw.githubusercontent.com/cepeter/kernel-fogos-g45/android-13-release-ttz/susfs-ksu10-rules-fix.patch" -o susfs-ksu10-rules-fix.patch
          git apply susfs-ksu10-rules-fix.patch
          echo "--- applying 5.10 API backports (path_umount/can_umount/strncpy) ---"
          curl -sL "https://raw.githubusercontent.com/cepeter/kernel-fogos-g45/android-13-release-ttz/susfs-backports-moto.patch" -o susfs-backports-moto.patch
          git apply susfs-backports-moto.patch
          grep -q "CONFIG_KSU_SUSFS" KernelSU/kernel/Kconfig && echo "KSU_SUSFS_KCONFIG_OK"
          echo "SUSFS_OK"

      - name: Generate defconfig (${{ inputs.variant }} / ${{ inputs.config_source }})
        env:
          TARGET_PRODUCT: ${{ inputs.product }}
          TARGET_BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          if [ "${{ inputs.config_source }}" = "stock" ]; then
            echo "=== USING EXACT STOCK -1-3 CONFIG ==="
            curl -sL "https://raw.githubusercontent.com/cepeter/kernel-fogos-g45/android-13-release-ttz/stock-fogos-1-3.config" -o .config
            wc -l .config
            grep -E "^CONFIG_LOCALVERSION=|^CONFIG_CC_VERSION_TEXT" .config | head -3
          else
            export PATH="${CLANG_BIN}:$PATH"
            export CLANG_TRIPLE=aarch64-linux-gnu-
            export REAL_CC=clang
            ./scripts/gki/generate_defconfig.sh vendor/holi-${{ inputs.variant }}_defconfig
            ls -la arch/arm64/configs/vendor/holi-${{ inputs.variant }}_defconfig
          fi

      - name: Apply defconfig
        if: inputs.config_source != 'stock'
        run: |
          export PATH="${CLANG_BIN}:$PATH"
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            vendor/holi-${{ inputs.variant }}_defconfig

      - name: Enable KernelSU configs
        if: inputs.ksu != 'none'
        run: |
          ./scripts/config --file .config -e CONFIG_KSU

      - name: Match stock (disable RELR — stock tree has no RELR support)
        run: |
          # Stock -1-3 config has NO CONFIG_RELR at all; olddefconfig on the
          # -1-2 tree enables it by default. RELR changes kernel relocation
          # format and can fail very early on this ABL → bootloop at logo.
          ./scripts/config --file .config -d CONFIG_RELR -d CONFIG_TOOLS_SUPPORT_RELR
          grep -E "CONFIG_RELR" .config || echo "RELR_DISABLED"

      - name: Enable SUSFS configs
        if: inputs.ksu != 'none' && inputs.susfs != 'none'
        run: |
          ./scripts/config --file .config \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT

      - name: olddefconfig
        run: |
          export PATH="${CLANG_BIN}:$PATH"
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS" .config | head -30

      - name: Build kernel
        run: |
          export PATH="${CLANG_BIN}:/usr/lib/ccache:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CCACHE=1
          # Redirect to build.log instead of piping through tee: GH Actions log
          # streaming can SIGPIPE clang/LLVM on huge outputs (esp. LTO/ThinLTO)
          # causing "LLVM ERROR: IO failure on output stream: Broken pipe".
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=gcc HOSTLD=ld HOSTAR=ar \
            KCFLAGS="-Wno-implicit-int -Wno-int-conversion -Wno-strict-prototypes -Wno-typedef-redefinition -Wno-gnu-variable-sized-type-not-at-end -Wno-shift-negative-value" \
            LLVM=1 LLVM_IAS=1 -j$(nproc) > build.log 2>&1 || { echo "=== BUILD FAILED — last 100 lines ==="; tail -100 build.log; exit 1; }
          echo "--- outputs ---"
          ls -la arch/arm64/boot/
          test -f arch/arm64/boot/Image -o -f arch/arm64/boot/Image.gz || { echo "NO_KERNEL_IMAGE"; tail -50 build.log; exit 1; }
          echo "BUILD_DONE"

      - name: Package outputs
        run: |
          mkdir -p dist
          cp -f arch/arm64/boot/Image.gz dist/ 2>/dev/null || true
          cp -f arch/arm64/boot/Image dist/ 2>/dev/null || true
          cp -f .config dist/kernel.config
          find arch/arm64/boot/dts -name "*.dtb" -exec cp --parents {} dist/ \; 2>/dev/null || true
          # Modules (stripped)
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 INSTALL_MOD_STRIP=1 \
            modules_install INSTALL_MOD_PATH=dist/modules 2>&1 | tail -5 || true
          (cd dist/modules && tar czf ../modules.tar.gz .) 2>/dev/null || true
          rm -rf dist/modules
          du -sh dist/*
          echo "PACKAGE_OK"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.variant }}-${{ inputs.tag }}-ksu${{ inputs.ksu }}-susfs${{ inputs.susfs }}
          path: |
            dist/**
            build.log
          if-no-files-found: error
