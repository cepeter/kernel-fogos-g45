name: Build Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Kernel tag/branch to build
        default: MMI-V1UGS35H.75-14-9-3-1-2
        required: true
        type: string
      variant:
        description: Build variant
        default: qgki-consolidate
        required: true
        type: choice
        options:
          - qgki
          - qgki-consolidate
          - qgki-debug
          - gki
          - gki-only
      product:
        description: TARGET_PRODUCT (device, e.g. fogos_g)
        default: fogos_g
        required: true
        type: string
      build_variant:
        description: TARGET_BUILD_VARIANT (user / userdebug)
        default: userdebug
        required: true
        type: choice
        options:
          - user
          - userdebug

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Prepare toolchain dirs
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          mkdir -p prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          mkdir -p prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9

      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: prebuilts
          key: tc-v3-${{ runner.arch }}

      - name: Cache ccache
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ inputs.tag }}-${{ inputs.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.tag }}-${{ inputs.variant }}-

      - name: Download Clang 16.0.6 (ZyCromerZ — known-good for 5.4)
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p prebuilts/clang/host/linux-x86/clang16
          curl -L --fail --silent --show-error \
            "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" \
            | tar -xz -C prebuilts/clang/host/linux-x86/clang16/
          ls -d prebuilts/clang/host/linux-x86/clang16/bin >/dev/null && echo "CLANG_OK"

      - name: Install ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache zip
          ccache --version | head -1

      - name: Resolve toolchain paths
        run: |
          CLANG_BIN="$(echo ${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86/clang*/bin | awk '{print $1}')"
          echo "CLANG_BIN=${CLANG_BIN}" >> "$GITHUB_ENV"
          echo "Resolved: CLANG_BIN=${CLANG_BIN}"

      - name: Verify toolchain (pure LLVM)
        run: |
          ls "${CLANG_BIN}" | grep -E "^(clang|ld.lld|llvm-ar|llvm-nm|llvm-objcopy)$" || true
          "${CLANG_BIN}/clang" --version | head -1
          echo "LLVM_TOOLCHAIN_READY"

      - name: Integrate KernelSU v1.0.2 (classic layout)
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v1.0.2/kernel/setup.sh" | bash -s v1.0.2
          ls -la KernelSU | head
          ls -la drivers/kernelsu 2>/dev/null || echo "WARN: no drivers/kernelsu symlink"
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig

      - name: Integrate SUSFS v1.5.5 (kernel-5.4 branch)
        run: |
          git clone --depth 1 -b kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu susfs4ksu
          # --- main kernel side ---
          cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch .
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          echo "--- applying 50_add_susfs_in_kernel-5.4.patch (4 known rejects, fixed next) ---"
          patch -p1 --forward < 50_add_susfs_in_kernel-5.4.patch || true
          echo "--- applying Motorola-specific fix ---"
          curl -sL "https://raw.githubusercontent.com/cepeter/kernel-fogos-g45/android-13-release-ttz/susfs-5.4-moto-fix.patch" -o susfs-5.4-moto-fix.patch
          git apply susfs-5.4-moto-fix.patch
          # --- KSU driver side (classic KernelSU dir at kernel root) ---
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          echo "--- applying 10_enable_susfs_for_ksu.patch (in KernelSU/, 1 known reject fixed next) ---"
          cd KernelSU && patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
          cd ..
          echo "--- applying KernelSU v1.0.2 core_hook fix ---"
          curl -sL "https://raw.githubusercontent.com/cepeter/kernel-fogos-g45/android-13-release-ttz/susfs-ksu10-moto-fix.patch" -o susfs-ksu10-moto-fix.patch
          git apply susfs-ksu10-moto-fix.patch
          grep -q "CONFIG_KSU_SUSFS" KernelSU/kernel/Kconfig && echo "KSU_SUSFS_KCONFIG_OK"
          echo "SUSFS_OK"

      - name: Generate defconfig (${{ inputs.variant }})
        env:
          TARGET_PRODUCT: ${{ inputs.product }}
          TARGET_BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          export PATH="${CLANG_BIN}:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export REAL_CC=clang
          ./scripts/gki/generate_defconfig.sh vendor/holi-${{ inputs.variant }}_defconfig
          ls -la arch/arm64/configs/vendor/holi-${{ inputs.variant }}_defconfig

      - name: Enable KSU + SUSFS configs
        run: |
          export PATH="${CLANG_BIN}:$PATH"
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            vendor/holi-${{ inputs.variant }}_defconfig
          ./scripts/config --file .config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS" .config | head -30

      - name: Build kernel
        run: |
          set -o pipefail
          export PATH="${CLANG_BIN}:/usr/lib/ccache:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CCACHE=1
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCC=gcc HOSTLD=ld HOSTAR=ar \
            LLVM=1 LLVM_IAS=1 -j$(nproc) 2>&1 | tee build.log
          echo "--- outputs ---"
          ls -la arch/arm64/boot/
          test -f arch/arm64/boot/Image -o -f arch/arm64/boot/Image.gz || { echo "NO_KERNEL_IMAGE"; exit 1; }
          echo "BUILD_DONE"

      - name: Package outputs
        run: |
          mkdir -p dist
          cp -f arch/arm64/boot/Image.gz dist/ 2>/dev/null || true
          cp -f arch/arm64/boot/Image dist/ 2>/dev/null || true
          cp -f .config dist/kernel.config
          find arch/arm64/boot/dts -name "*.dtb" -exec cp --parents {} dist/ \; 2>/dev/null || true
          # Modules (stripped)
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 INSTALL_MOD_STRIP=1 \
            modules_install INSTALL_MOD_PATH=dist/modules 2>&1 | tail -5 || true
          (cd dist/modules && tar czf ../modules.tar.gz .) 2>/dev/null || true
          rm -rf dist/modules
          du -sh dist/*
          echo "PACKAGE_OK"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.variant }}-${{ inputs.tag }}
          path: |
            dist/**
            build.log
          if-no-files-found: error
